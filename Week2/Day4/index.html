<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <h1>Todo List</h1>

      <input
        id="todo-input"
        type="text"
        placeholder="Add a new todo and press Enter"
        autocomplete="off"
      />

      <ul id="todo-list"></ul>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
