events {}

http {

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name devansh-hestabit.local;

    return 301 https://$host$request_uri;
  }

  # HTTPS server
  server {
    listen 443 ssl;
    server_name devansh-hestabit.local;

    ssl_certificate     /etc/nginx/ssl/devansh-hestabit.local.pem;
    ssl_certificate_key /etc/nginx/ssl/devansh-hestabit.local-key.pem;

    location / {
      proxy_pass http://app:3000;
    }
  }
}
